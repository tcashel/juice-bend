min_version = "2026.9.12"

[tools]
bun = "1.4.2"

[env]
BEND_NO_TELEMETRY = "1"
BEND_REVISION = "60ca80aedeec9d8f0629b5f10dd19457d8ad67af"

[tasks.setup]
description = "Fetch the pinned Bend compiler into .tools"
run = "./scripts/setup"

[tasks.doctor]
run = "./scripts/doctor"

[tasks.build]
run = "./scripts/build"

[tasks.app]
description = "Build a local unsigned .app at a new output path"
run = "./scripts/app"

[tasks.run]
run = "./scripts/run"

[tasks.test]
run = "./scripts/test"

[tasks.prove]
run = "./scripts/prove"

[tasks.bench]
run = "./scripts/bench"

[tasks.smoke-ui]
run = "./scripts/smoke-ui"
